<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Niconico 設定</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="white" stroke-width="2"/>
              <path d="M8 10C8 10 9 11 10 11C11 11 12 10 12 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 10C12 10 13 11 14 11C15 11 16 10 16 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 15C16 15 15 16 14 16H10C9 16 8 15 8 15" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="title">Better Niconico</h1>
        </div>
        <div class="version-badge" id="version">v1.0.0</div>
      </div>
      <div class="tabs">
        <button class="tab-button active" data-tab="video">動画</button>
        <button class="tab-button" data-tab="ui">UI/表示</button>
        <button class="tab-button" data-tab="system">システム</button>
      </div>
    </header>

    <main class="settings-container" id="settingsContainer">
      <!-- Settings will be dynamically injected here -->
    </main>

    <footer class="footer">
      <div class="status-message" id="statusMessage"></div>
      <a href="https://github.com/kongyo2/better-niconico" target="_blank" class="github-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

        </svg>
        GitHub
      </a>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
